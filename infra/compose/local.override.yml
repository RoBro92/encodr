services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - encodr-postgres-dev:/var/lib/postgresql/data

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - encodr-redis-dev:/data

volumes:
  encodr-postgres-dev:
  encodr-redis-dev:
